    <rect x="800" y="385" width="20" height="115"/>
    <rect x="850" y="370" width="35" height="130"/>
    <rect x="910" y="390" width="22" height="110"/>
    <rect x="960" y="360" width="28" height="140"/>
    <rect x="1020" y="380" width="24" height="120"/>
    <rect x="1070" y="395" width="20" height="105"/>

  </g>
  <!-- Foreground ground -->
  <rect y="490" width="1200" height="110" fill="#0a1a0a" opacity="0.7"/>
  <!-- Sun glow -->
  <circle cx="900" cy="100" r="80" fill="#f8d56a" opacity="0.08"/>
